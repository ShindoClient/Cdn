[package]
name = "api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "app"
path = "src-rs/lib.rs"

[[bin]]
name = "server"
path = "api/server.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5.3"
vercel_runtime = { version = "2.4.1", features = ["axum"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"] }
url = "2"
